<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💻 Flipkart Laptops - Pie Chart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      color: #00f0ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .btn-container {
      margin: 10px 0;
      position: sticky;
      top: 80px;
      background: rgba(0,0,0,0.4);
      padding: 10px;
      z-index: 900;
    }

    .btn {
      display: inline-block;
      margin: 0 10px;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #00f0ff, #ff0080);
      box-shadow: 0 0 10px rgba(0,240,255,0.6);
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(0,240,255,0.9);
    }

    /* Chart container */
    .chart-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    img {
      max-width: 95vw;  /* screen ke andar fit */
      max-height: 80vh; /* viewport ke andar fit */
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,240,255,0.4);
    }
  </style>
</head>
<body>
  <header>💻 Top 5 Most Expensive Laptops - Flipkart</header>
  <div class="btn-container">
    <a href="/scrape_flipkart" class="btn">🏠 Back to Data</a>
    <a href="/pie_flipkart" class="btn">🔄 Refresh Chart</a>
  </div>
  <div class="chart-container">
    <img src="{{ chart_url }}" alt="Laptop Pie Chart">
  </div>
</body>
</html>
