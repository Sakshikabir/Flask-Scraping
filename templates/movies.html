<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎬 Top IMDb Movies - Sakshi Kabir</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      min-height: 100vh;
      text-align: center;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 40px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0,240,255,0.6);
      margin-bottom: 15px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 10px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #00f0ff, #ff0080);
      box-shadow: 0 0 10px rgba(0,240,255,0.6);
      transition: 0.3s;
      cursor: pointer;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(0,240,255,0.9);
    }

    .table-container {
      margin: 20px auto;
      width: 90%;
      overflow-x: auto;
      background: rgba(0, 0, 0, 0.5);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,240,255,0.4);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      text-align: left;
      color: #e0e0e0;
    }
    th {
      background: rgba(0,240,255,0.2);
      color: #00f0ff;
      font-weight: 700;
      text-transform: uppercase;
    }
    tr:hover td {
      background: rgba(0,240,255,0.1);
    }

    footer {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      padding: 15px;
      font-size: 14px;
      color: #aaa;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎬 Top IMDb Movies</h1>
    <div class="btn-container">
      <a href="/scraping" class="btn">⬅ Back </a>
      <a href="/bar_movies" class="btn">📊 View Bar Chart</a>
      <a href="/pie_movies" class="btn">🥧 View Pie Chart</a>
    </div>
  </header>

  <main class="table-container">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Movie Title</th>
          <th>Rating</th>
        </tr>
      </thead>
      <tbody>
        {% for movie in movies %}
        <tr>
          <td>{{ loop.index }}</td>
          <td>{{ movie['title'] }}</td>
          <td>{{ movie['rating'] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </main>

  <footer>
    © 2025 Data Analytics Trainee | Built with ❤️ by Sakshi Kabir
  </footer>
</body>
</html>
