<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💻 Top IMDb Movies - Bar Chart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 40px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      color: #00f0ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .btn-container {
      margin: 10px 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #00f0ff, #ff0080);
      box-shadow: 0 0 10px rgba(0,240,255,0.6);
      transition: 0.3s;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(0,240,255,0.9);
    }

    .chart-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    img {
      max-width: 95vw;
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,240,255,0.4);
    }

    footer {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      padding: 15px;
      font-size: 14px;
      color: #aaa;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header>💻 Top 10 IMDb Movies - Ratings</header>

  <div class="btn-container">
    <a href="/scrape_movies" class="btn">🏠 Back to Data</a>
    <a href="/bar_movies" class="btn">🔄 Refresh Chart</a>
    <a href="/pie_movies" class="btn">🥧 View Pie Chart</a>
  </div>

  <div class="chart-container">
    <img src="{{ chart_url }}" alt="IMDb Movies Bar Chart">
  </div>

  <footer>
    © 2025 Data Analytics Trainee | Built with ❤️ by Sakshi Kabir
  </footer>
</body>
</html>
