<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📊 IMDb Bar Chart - Sakshi Kabir</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0,240,255,0.6);
      margin-bottom: 20px;
    }
    img {
      max-width: 90%;
      border-radius: 10px;
      margin: 20px auto;
      display: block;
      box-shadow: 0 0 20px rgba(0,240,255,0.4);
    }
    .buttons {
      margin: 25px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
    .buttons a {
      display: inline-block;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #00f0ff, #ff0080);
      box-shadow: 0 0 10px rgba(0,240,255,0.6);
      transition: 0.3s;
    }
    .buttons a:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(0,240,255,0.9);
    }
  </style>
</head>
<body>
  <h1>📊 Top 10 IMDb Movies - Bar Chart</h1>

  <div class="buttons">
    <a href="/scrape_movies">🎬 Back to Table</a>
    <a href="/movie_pie_chart">🥧 View Pie Chart</a>
    <a href="/">🏠 Home</a>
  </div>

  {% if bar_chart %}
    <img src="{{ url_for('static', filename=movies_bar_chart) }}" alt="Movies Bar Chart">
  {% else %}
    <p>⚠ Bar chart not generated yet. Go to <a href="/scrape_movies">Scrape Movies</a> first.</p>
  {% endif %}
</body>
</html>
