<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ stock }} Stock Price</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #00ffcc; }
        h2 { margin-top: 30px; color: #00ccff; }
        img { max-width: 90%; height: auto; border-radius: 12px; box-shadow: 0 0 15px #00ffcc55; margin-top: 20px; }
        pre, table { background: #2c2c2c; padding: 15px; border-radius: 10px; overflow-x: auto; display: inline-block; text-align: left; margin-top: 20px; }
        table { border-collapse: collapse; }
        th, td { padding: 8px 12px; border: 1px solid #555; }
        th { background-color: #333; }
    </style>
</head>
<body>
    <h1>{{ stock }} Closing Price</h1>
    <p>Data from {{ start_date }} to {{ end_date }}</p>

    {% if img_base64 %}
        <img src="data:image/png;base64,{{ img_base64 }}" alt="Stock Plot">
    {% else %}
        <p>Plot not available</p>
    {% endif %}

    <h2>Data Summary</h2>
    {% if summary %}
        {{ summary|safe }}
    {% else %}
        <p>Data not available</p>
    {% endif %}

</body>
</html>
