<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yahoo Finance - Mutual Funds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Rajdhani', sans-serif;
            padding: 20px;
        }
        table {
            background-color: #2a2a2a;
        }
        th, td {
            text-align: center;
            vertical-align: middle;
        }
        th {
            color: cyan;
        }
        a {
            color: #00ffff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>📈 Top Mutual Funds - Yahoo Finance</h2>

    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Last Price</th>
                    <th>Change</th>
                    <th>% Change</th>
                    <th>Type</th>
                    <th>Assets</th>
                    <th>Yield</th>
                </tr>
            </thead>
            <tbody>
                {% for fund in funds %}
                <tr>
                    <td>{{ fund['Name'] }}</td>
                    <td>{{ fund['Last Price'] }}</td>
                    <td>{{ fund['Change'] }}</td>
                    <td>{{ fund['% Change'] }}</td>
                    <td>{{ fund['Type'] }}</td>
                    <td>{{ fund['Assets'] }}</td>
                    <td>{{ fund['Yield'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <br>
    <a href="/">⬅ Back to Home</a>
</body>
</html>
