<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🥧 Top 10 Mutual Funds - Pie Chart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Rajdhani', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  /* Animated Background */
  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  /* Chart Card */
  .chart-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(0,240,255,0.4);
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow: 0 0 25px rgba(0,240,255,0.2);
    backdrop-filter: blur(12px);
    max-width: 1000px;
    width: 95%;
    text-align: center;
    animation: fadeIn 1.2s ease-in-out;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 34px;
    color: #00f0ff;
    text-shadow: 0 0 15px rgba(0,240,255,0.8);
    margin-bottom: 25px;
  }

  .chart-container img {
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,240,255,0.3);
    max-width: 100%;
  }

  /* Buttons */
  .btn {
    display: inline-block;
    margin: 15px 12px 0;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #00f0ff, #ff0080);
    box-shadow: 0 0 12px rgba(0,240,255,0.5);
    transition: 0.3s;
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 0 20px rgba(0,240,255,0.9), 0 0 30px rgba(255,0,128,0.7);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- Animated Background -->
<canvas id="bg"></canvas>

<div class="chart-card">
  <h1>🥧 Top 10 Mutual Funds by Assets - Pie Chart</h1>

  <div class="chart-container">
    <img src="{{ chart_url }}" alt="Pie Chart">
  </div>

  <div>
    <a href="{{ url_for('scrape_yahoo') }}" class="btn">⬅ Back to Table</a>
    <a href="{{ url_for('bar_chart_yahoo') }}" class="btn">📊 View Bar Chart</a>
  </div>
</div>

<!-- Background Animation Script -->
<script>
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let particles = [];
  const numParticles = 80;

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.radius = 2;
      this.vx = (Math.random() - 0.5) * 1;
      this.vy = (Math.random() - 0.5) * 1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#00f0ff';
      ctx.fill();
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
      if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      this.draw();
    }
  }

  for (let i = 0; i < numParticles; i++) particles.push(new Particle());

  function connect() {
    for (let a = 0; a < particles.length; a++) {
      for (let b = a; b < particles.length; b++) {
        let dx = particles[a].x - particles[b].x;
        let dy = particles[a].y - particles[b].y;
        let distance = Math.sqrt(dx*dx + dy*dy);
        if (distance < 120) {
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(particles[a].x, particles[a].y);
          ctx.lineTo(particles[b].x, particles[b].y);
          ctx.stroke();
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => p.update());
    connect();
    requestAnimationFrame(animate);
  }
  animate();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>
</body>
</html>
